<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  canvas { display:block; }
  #info { position:absolute; top:4px; left:4px; color:#0f0; font:10px monospace; z-index:9;
          text-shadow:0 0 2px #000; pointer-events:none; }
  #status { position:absolute; bottom:4px; left:4px; color:#ff0; font:10px monospace; z-index:9;
            text-shadow:0 0 2px #000; pointer-events:none; }
</style>
</head>
<body>
<div id="info">probe</div>
<div id="status">loading...</div>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
<script type="module">
const info = document.getElementById('info');
const status = document.getElementById('status');
const log = (m) => { console.log(m); status.textContent = m; };

try {
  const THREE = await import('three');
  const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
  const { VRMLoaderPlugin } = await import('./vendor/three-vrm.module.js');
  log('modules ok, three=' + THREE.REVISION);

  const ctx = {};
  try { ctx.webgl = !!document.createElement('canvas').getContext('webgl2'); } catch(e) { ctx.webgl = 'err:' + e.message; }
  info.textContent = 'webgl2=' + ctx.webgl + ' rev=' + THREE.REVISION;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, 320/420, 0.1, 100);
  camera.position.set(0, 1.25, 2.6);
  camera.lookAt(0, 1.05, 0);

  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
  renderer.setClearColor(0x000000, 0);
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 1.6));
  const dl = new THREE.DirectionalLight(0xffffff, 1.8); dl.position.set(0.5, 2, 2.5); scene.add(dl);
  const dl2 = new THREE.DirectionalLight(0x99bbff, 0.8); dl2.position.set(-1, 0.5, -1.5); scene.add(dl2);

  const clock = new THREE.Clock();
  let vrm = null, mixer = null;
  window.__vrm = null;

  const loader = new GLTFLoader();
  loader.register((parser) => new VRMLoaderPlugin(parser));
  log('loading vrm...');

  loader.load('./michelle.vrm', (gltf) => {
    try {
      log('gltf parsed; userData keys=' + Object.keys(gltf.userData || {}).join(','));
      vrm = gltf.userData.vrm;
      if (!vrm) { log('ERROR: userData.vrm is undefined'); return; }
      window.__vrm = vrm;

      scene.add(vrm.scene);
      vrm.scene.rotation.y = Math.PI;
      vrm.scene.traverse((o) => { if (o.isMesh) o.frustumCulled = false; });

      const expr = vrm.expressionManager ? Object.keys(vrm.expressionManager.expressionMap || {}) : [];
      const bones = vrm.humanoid ? Object.keys(vrm.humanoid.humanBones || {}) : [];
      const springs = vrm.springBoneManager ? (vrm.springBoneManager.joints?.size ?? 'n/a') : 'none';

      // 包围盒
      const box = new THREE.Box3().setFromObject(vrm.scene);
      const size = box.getSize(new THREE.Vector3());
      const head = vrm.humanoid?.getNormalizedBoneNode('head');
      const headPos = head ? head.getWorldPosition(new THREE.Vector3()).toArray().map(v=>+v.toFixed(3)) : null;

      log('VRM OK | expr=' + expr.length + ' bones=' + bones.length +
          ' springs=' + springs + ' h=' + size.y.toFixed(2));
      info.innerHTML = 'VRM loaded<br>expr=' + expr.length + '<br>bones=' + bones.length +
                       '<br>springs=' + springs + '<br>h=' + size.y.toFixed(2) +
                       '<br>head=' + JSON.stringify(headPos) +
                       '<br>exprs=' + expr.slice(0,10).join(',');

      // 自动取景
      if (headPos) {
        const target = new THREE.Vector3(0, size.y * 0.62, 0);
        const dist = size.y * 1.35;
        camera.position.set(0, target.y + size.y * 0.02, dist);
        camera.lookAt(target);
      }

      window.__loaded = true;
    } catch (e) {
      log('ERROR in callback: ' + e.message + ' @ ' + (e.stack||'').split('\n')[1]);
    }
  }, (ev) => {
    if (ev.total) log('progress ' + Math.round(ev.loaded / ev.total * 100) + '%');
  }, (err) => {
    log('LOAD ERROR: ' + (err && err.message ? err.message : String(err)));
  });

  function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();
    if (vrm) vrm.update(dt);
    if (mixer) mixer.update(dt);
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  });

  // --- 供 Python 侧抓取渲染结果（WebGL preserveDrawingBuffer 必须为 true）---
  window.__snapshot = () => {
    renderer.render(scene, camera);
    return renderer.domElement.toDataURL('image/png');
  };

  // --- 供 Python 侧控制表情 / 旋转 / 骨骼 ---
  window.__setExpression = (name, weight) => {
    if (!vrm || !vrm.expressionManager) return 'no expr mgr';
    vrm.expressionManager.setValue(name, weight);
    vrm.expressionManager.update();
    return 'ok';
  };
  window.__setRotation = (y) => { if (vrm) vrm.scene.rotation.y = y; return 'ok'; };
  window.__listExpressions = () => vrm?.expressionManager
    ? Object.keys(vrm.expressionManager.expressionMap || {}) : [];
  window.__listBones = () => vrm?.humanoid ? Object.keys(vrm.humanoid.humanBones || {}) : [];
  window.__listMaterials = () => {
    const out = [];
    if (vrm) vrm.scene.traverse(o => {
      if (o.isMesh) {
        const ms = Array.isArray(o.material) ? o.material : [o.material];
        ms.forEach(m => m && out.push({
          name: m.name, type: m.type,
          hasMap: !!m.map, mapOff: m.map ? [m.map.offset.x, m.map.offset.y] : null,
          mapRep: m.map ? [m.map.repeat.x, m.map.repeat.y] : null,
          opacity: m.opacity, transparent: m.transparent, side: m.side,
        }));
      }
    });
    return out;
  };
  // UV 偏移测试（卡拉彼丘表情多为此机制）
  window.__setMapOffset = (matName, u, v) => {
    let n = 0;
    if (vrm) vrm.scene.traverse(o => {
      if (!o.isMesh) return;
      const ms = Array.isArray(o.material) ? o.material : [o.material];
      ms.forEach(m => {
        if (m && m.name === matName && m.map) { m.map.offset.set(u, v); m.map.needsUpdate = true; n++; }
      });
    });
    return 'touched ' + n;
  };
  window.__setMaterialColor = (matName, r, g, b) => {
    let n = 0;
    if (vrm) vrm.scene.traverse(o => {
      if (!o.isMesh) return;
      const ms = Array.isArray(o.material) ? o.material : [o.material];
      ms.forEach(m => { if (m && m.name === matName) { m.color.setRGB(r, g, b); n++; } });
    });
    return 'touched ' + n;
  };
  window.__setViseme = (v) => {
    if (!vrm || !vrm.expressionManager) return 'no expr mgr';
    vrm.expressionManager.setValue('aa', 0); vrm.expressionManager.setValue('ih', 0);
    vrm.expressionManager.setValue('ou', 0); vrm.expressionManager.setValue('ee', 0);
    vrm.expressionManager.setValue('oh', 0);
    if (v) vrm.expressionManager.setValue(v, 0.6);
    vrm.expressionManager.update();
    return 'ok';
  };
  // --- 性能统计 ---
  let __frames = 0, __lastT = performance.now();
  window.__fps = 0;
  setInterval(() => {
    const now = performance.now();
    window.__fps = __frames * 1000 / (now - __lastT);
    __frames = 0; __lastT = now;
  }, 1000);
  const __raf = requestAnimationFrame;
  window.requestAnimationFrame = (cb) => __raf((t) => { __frames++; cb(t); });
  window.__gpu = (() => {
    const gl = document.createElement('canvas').getContext('webgl2');
    if (!gl) return 'no-webgl2';
    const ext = gl.getExtension('WEBGL_debug_renderer_info');
    return ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
  })();
  window.__blink = (v) => {
    if (!vrm || !vrm.expressionManager) return 'no expr mgr';
    vrm.expressionManager.setValue('blink', v);
    vrm.expressionManager.setValue('blinkLeft', v);
    vrm.expressionManager.setValue('blinkRight', v);
    vrm.expressionManager.update();
    return 'ok';
  };
  window.__lookAt = (x, y) => {
    if (!vrm || !vrm.lookAt) return 'no lookAt';
    vrm.lookAt.appliedHipPivot = false;
    vrm.lookAt.userTarget = new THREE.Vector3(x, y, 0.5);
    return 'ok';
  };

} catch (e) {
  log('FATAL: ' + e.message);
  console.error(e);
}
</script>
</body>
</html>
